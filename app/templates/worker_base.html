<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Worker{% endblock %}</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    :root{
      --accent:          #14b8a6;
      --accent-hover:    #0d9488;
      --accent-soft:     rgba(20,184,166,0.10);
      --surface:         #ffffff;
      --bg:              #f1f5f9;
      --text-primary:    #0f172a;
      --text-secondary:  #64748b;
      --text-muted:      #94a3b8;
      --border:          #e2e8f0;
      --radius:          10px;
      --shadow-sm:       0 1px 2px rgba(0,0,0,0.05);
      --shadow:          0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md:       0 4px 12px rgba(0,0,0,0.08);

      /* status accents used across worker pages */
      --accent-purple:   #7c3aed;
      --accent-blue:     #3b82f6;
      --accent-teal:     #14b8a6;
      --accent-pink:     #ec4899;
      --accent-amber:    #f59e0b;
      --accent-emerald:  #10b981;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body{
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      font-size: 0.875rem;
      line-height: 1.6;
      min-height: 100vh;
      padding: 0;
      margin: 0;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }
    h2 { font-size: 1.375rem; }
    h4 { font-size: 1.05rem; }
    h5 { font-size: 0.9rem; }

    /* ── Top Nav ─────────────────────────────────── */
    .navbar{
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      height: 56px;
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    .navbar-brand{
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-primary) !important;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .navbar-brand::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }

    .container.tight {
      max-width: 1200px;
      padding: 1.75rem 1.5rem;
      margin: 0 auto;
    }

    /* ── Bootstrap overrides ─────────────────────── */

    .btn {
      font-family: 'Inter', sans-serif;
      font-size: 0.8125rem;
      font-weight: 500;
      border-radius: var(--radius);
      padding: 0.4rem 0.875rem;
      transition: all 0.15s ease;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn-primary:hover, .btn-primary:focus {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      color: #fff;
    }

    .btn-outline-primary {
      color: var(--accent);
      border-color: var(--accent);
    }
    .btn-outline-primary:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-outline-secondary {
      color: var(--text-secondary);
      border-color: var(--border);
      background: var(--surface);
    }
    .btn-outline-secondary:hover {
      background: var(--bg);
      border-color: #cbd5e1;
      color: var(--text-primary);
    }

    .btn-sm {
      font-size: 0.75rem;
      padding: 0.3rem 0.65rem;
      border-radius: 8px;
    }

    /* Cards (both bootstrap .card and legacy .glass-card) */
    .card, .glass-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .card-header {
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.8125rem;
      color: var(--text-primary);
      padding: 0.75rem 1rem;
    }

    .card-body { padding: 1rem; }

    .card-footer {
      background: #f8fafc;
      border-top: 1px solid var(--border);
      padding: 0.625rem 1rem;
    }

    .shadow-sm { box-shadow: var(--shadow) !important; }

    /* Tables */
    .table { font-size: 0.8125rem; color: var(--text-primary); }
    .table th {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
      border-bottom-color: var(--border);
      background: #f8fafc;
      padding: 0.625rem 0.875rem;
    }
    .table td {
      padding: 0.625rem 0.875rem;
      border-bottom-color: var(--border);
      vertical-align: middle;
    }

    /* Forms */
    .form-control, .form-select {
      font-size: 0.8125rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      background: var(--surface);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      padding: 0.4rem 0.75rem;
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(20,184,166,0.15);
      outline: none;
    }
    .form-control-sm, .form-select-sm {
      font-size: 0.75rem;
      padding: 0.275rem 0.6rem;
      border-radius: 8px;
    }
    .form-label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 0.35rem;
    }

    /* Alerts */
    .alert { border-radius: var(--radius); font-size: 0.8125rem; border-width: 1px; padding: 0.75rem 1rem; }
    .alert-success { background: rgba(20,184,166,0.08); border-color: rgba(20,184,166,0.25); color: #0d7a6d; }
    .alert-danger  { background: rgba(239,68,68,0.07);  border-color: rgba(239,68,68,0.2);   color: #b91c1c; }
    .alert-warning { background: rgba(245,158,11,0.08); border-color: rgba(245,158,11,0.25); color: #92400e; }
    .alert-info    { background: rgba(59,130,246,0.07); border-color: rgba(59,130,246,0.2);  color: #1e40af; }

    /* Badges */
    .badge { font-size: 0.7rem; font-weight: 600; border-radius: 999px; padding: 0.25em 0.6em; }
    .bg-primary   { background: var(--accent) !important; }
    .bg-success   { background: #10b981 !important; }
    .bg-warning   { background: #f59e0b !important; }
    .bg-danger    { background: #ef4444 !important; }
    .bg-secondary { background: #64748b !important; }

    /* List groups */
    .list-group-item {
      border-color: var(--border);
      font-size: 0.8125rem;
      padding: 0.75rem 1rem;
      background: var(--surface);
    }
    .list-group-item:first-child { border-radius: var(--radius) var(--radius) 0 0; }
    .list-group-item:last-child { border-radius: 0 0 var(--radius) var(--radius); }
    .list-group-item:only-child { border-radius: var(--radius); }

    /* Progress bar */
    .progress { background: var(--border); border-radius: 999px; overflow: hidden; }

    /* Modals */
    .modal-content { border-radius: var(--radius); border-color: var(--border); box-shadow: var(--shadow-md); }
    .modal-header { border-bottom-color: var(--border); padding: 1rem 1.25rem; }
    .modal-footer { border-top-color: var(--border); padding: 0.75rem 1.25rem; }

    /* Text helpers */
    .text-muted { color: var(--text-muted) !important; }
    .text-secondary { color: var(--text-secondary) !important; }

    /* Responsive */
    @media (max-width: 575.98px){
      .container.tight { padding: 1.25rem 1rem; }
    }

    {% block extra_css %}{% endblock %}
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

<!-- Header -->
<nav class="navbar">
  <div class="d-flex justify-content-between align-items-center w-100">
    <a href="/worker/home" class="navbar-brand text-decoration-none">{% block nav_title %}Worker{% endblock %}</a>
    <div class="d-flex gap-2 align-items-center">
      {% block nav_actions %}
      <a href="/worker/home" class="btn btn-outline-secondary btn-sm">Home</a>
      <a href="/logout" class="btn btn-outline-secondary btn-sm">Logout</a>
      {% endblock %}
    </div>
  </div>
</nav>

<div class="container tight">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
