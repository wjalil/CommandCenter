{# Shared styles for the Daily Delivery Invoice page. Kept to what xhtml2pdf
   renders reliably (tables, borders, no flex/grid) so screen and PDF match. #}
<style>
  .ddi { font-family: Helvetica, Arial, sans-serif; font-size: 9.5pt; color: #111; }
  .ddi table { width: 100%; border-collapse: collapse; }
  .ddi td, .ddi th { vertical-align: top; }
  .ddi-title { font-size: 16pt; font-weight: bold; letter-spacing: 1px; }
  .ddi-sub { font-size: 8.5pt; color: #555; }
  .ddi-meta td { padding: 1px 0; font-size: 9pt; }
  .ddi-meta .k { color: #555; width: 38%; }
  .ddi-label { font-size: 7.5pt; font-weight: bold; color: #555; text-transform: uppercase; letter-spacing: 0.5px; }
  .ddi-party { border: 1px solid #999; padding: 4px 8px; line-height: 1.25; }
  .ddi-party-name { font-size: 11pt; font-weight: bold; }
  .ddi-summary { margin-top: 6px; border: 1px solid #111; }
  .ddi-summary td { padding: 3px 8px; font-size: 9.5pt; }
  .ddi-summary .big { font-size: 13pt; font-weight: bold; }
  .ddi-meal { margin-top: 6px; }
  .ddi-meal-head td { background-color: #222; color: #fff; padding: 3px 8px; font-weight: bold; font-size: 9.5pt; }
  .ddi-items th { background-color: #e9e9e9; border: 1px solid #999; padding: 2px 6px; font-size: 8pt; text-align: left; }
  .ddi-items td { border: 1px solid #999; padding: 2px 6px; font-size: 9pt; }
  .ddi-items .num { text-align: right; white-space: nowrap; }
  .ddi-sub-mark { font-weight: bold; }
  .ddi-note { font-size: 8pt; color: #333; margin-top: 3px; }
  .ddi-subs { margin-top: 6px; }
  .ddi-subs td { border: 1px dashed #777; padding: 5px 8px; font-size: 8.5pt; }
  .ddi-sign { margin-top: 10px; border: 1px solid #111; }
  .ddi-sign td { border: 1px solid #111; padding: 4px 8px; font-size: 8.5pt; }
  .ddi-sign td.ddi-write { font-size: 7.5pt; color: #555; padding: 2px 6px 22px 6px; }
  .ddi-draft { border: 2px solid #c00; color: #c00; font-weight: bold; text-align: center; padding: 3px; margin-bottom: 6px; font-size: 10pt; }
</style>
